function applyFilter(){
    let loc=document.getElementById("filterLocation").value.trim().toLowerCase();
    let min=parseInt(document.getElementById("filterMinPrice").value)||0;
    let max=parseInt(document.getElementById("filterMaxPrice").value)||Infinity;
    let filtered=listings.filter(item=>{
        let matchLoc=item.location.toLowerCase().includes(loc);
        let matchPrice=item.price>=min && item.price<=max;
        return matchLoc && matchPrice;
    });
    displayListings(filtered);
}

function clearFilter(){
    document.getElementById("filterLocation").value="";
    document.getElementById("filterMinPrice").value="";
