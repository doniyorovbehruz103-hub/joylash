<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UyTop - Uy tafsilotlari</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body { font-family:'Roboto',sans-serif; margin:0; background:#f0f4ff; padding:20px; }
.container { background:white; padding:30px; border-radius:20px; max-width:600px; margin:auto; box-shadow:0 8px 20px rgba(0,0,0,0.15);}
h2 { color:#2b7cff; margin-bottom:15px; }
img { width:100%; border-radius:15px; margin-bottom:15px; object-fit:cover; }
p { margin-bottom:10px; }
.price { font-weight:700; color:#28a745; font-size:20px; margin-bottom:15px; }
p a { color:#2b7cff; text-decoration:none; font-weight:500; }
p a:hover { text-decoration:underline; }
</style>
</head>
<body>

<div class="container">
<h2 id="title"></h2>
<p id="location"></p>
<p class="price" id="price"></p>
<img id="image" src="" alt="" style="display:none;">
<p id="description"></p>
<p style="font-weight:500;">Egasi: <span id="owner"></span></p>
<p><a href="index.html">⬅ Orqaga</a></p>
</div>

<script>
let params = new URLSearchParams(window.location.search);
let id = parseInt(params.get("id"));
let listings = JSON.parse(localStorage.getItem("uytop_listings")) || [];
let item = listings.find(x=>x.id===id);

if(item){
    document.getElementById("title").innerText = item.title;
    document.getElementById("location").innerText = "📍 " + item.location;
    document.getElementById("price").innerText = item.price + " so‘m";
    document.getElementById("description").innerText = item.description;
    document.getElementById("owner").innerText = item.owner;
    if(item.image){ document.getElementById("image").src=item.image; document.getElementById("image").style.display="block"; }
} else {
    alert("Uy topilmadi!");
    window.location.href="index.html";
}
</script>

</body>
</html>
