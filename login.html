<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UyTop - Kirish / Ro‘yxatdan o‘tish</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body { font-family:'Roboto',sans-serif; margin:0; background:linear-gradient(135deg,#f0f4ff,#e1f0ff); display:flex; justify-content:center; align-items:center; height:100vh; }
.container { background:white; padding:50px 35px; border-radius:25px; box-shadow:0 15px 40px rgba(0,0,0,0.2); width:100%; max-width:400px; text-align:center; }
h2 { margin-bottom:40px; color:#2b7cff; font-size:28px; }
input { width:100%; padding:15px; margin-bottom:20px; border-radius:15px; border:1px solid #ccc; font-size:16px; }
input:focus { border-color:#2b7cff; box-shadow:0 0 12px rgba(43,124,255,0.3); outline:none; }
button { width:100%; padding:15px; border:none; border-radius:15px; background:linear-gradient(90deg,#2b7cff,#4aa0ff); color:white; font-size:16px; font-weight:500; cursor:pointer; transition:all 0.3s ease; }
button:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(43,124,255,0.4); }
#welcomeMsg { font-weight:500; color:#333; margin-top:20px; }
p a { color:#2b7cff; text-decoration:none; font-weight:500;}
p a:hover { text-decoration:underline;}
</style>
</head>
<body>

<div class="container">
<h2>UyTop - Kirish / Ro‘yxatdan o‘tish</h2>
<input type="text" id="name" placeholder="Ismingiz" />
<input type="text" id="phone" placeholder="Telefon raqam" />
<button id="registerBtn">Ro‘yxatdan o‘tish</button>
<p id="welcomeMsg"></p>
<p>Orqaga <a href="index.html">UyTop bosh sahifasi</a></p>
</div>

<script>
document.getElementById("registerBtn").addEventListener("click", function(){
    let name = document.getElementById("name").value.trim();
    let phone = document.getElementById("phone").value.trim();
    if(!name || !phone){ alert("Iltimos, barcha maydonlarni to‘ldiring!"); return; }
    let user = {name, phone};
    localStorage.setItem("uytop_user", JSON.stringify(user));
    document.getElementById("welcomeMsg").innerText = Xush kelibsiz, ${name}!;
    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
});
</script>

</body>
</html>
